name: Submit Kaggle Training
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run reason'
        required: false
        default: manual
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U kaggle
      - name: Submit Kaggle kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: kaggle kernels push -p kaggle
